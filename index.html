<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>GitHub Login Page</title>
</head>
<body>
    <body class="bg-slate-100 flex items-center justify-center min-h-screen p-4 font-sans">

  <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-8 md:p-12">
    
    <div class="flex flex-col items-center mb-8">
      <div class="w-20 h-20 mb-4">
        <svg viewBox="0 0 24 24" class="fill-slate-800" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-800 tracking-tight">GitHub Issues Tracker</h1>
      <p class="text-slate-500 text-sm mt-1">Sign in to manage your issues</p>
    </div>

    <form action="#" class="space-y-5">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Username</label>
        <input type="text" placeholder="Enter Username" 
               class="w-full px-4 py-3 rounded-md border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-200">
        <p class="text-[12px] text-indigo-600 mt-1 font-medium italic">Default: admin</p>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
        <input type="password" placeholder="Enter Password" 
               class="w-full px-4 py-3 rounded-md border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-200">
        <p class="text-[12px] text-indigo-600 mt-1 font-medium italic">Default: admin123</p>
      </div>

      <button type="submit" 
              class="w-full bg-[#4F00FF] hover:bg-[#4300DB] text-white font-semibold py-3 rounded-md transition duration-300 shadow-md">
         <a href="homepage.html">Sign In</a> 
      </button>
    </form>

    <div class="relative my-8">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-slate-200"></div>
      </div>
      <div class="relative flex justify-center text-sm">
        <span class="px-2 bg-white text-slate-400">OR</span>
      </div>
    </div>

    <div class="text-center">
      <p class="text-slate-500 text-xs mb-4">Demo Credentials:</p>
      <div class="bg-slate-50 rounded-lg p-4 text-sm text-slate-700 leading-relaxed border border-slate-100">
        <p><span class="font-bold">Username:</span> admin</p>
        <p><span class="font-bold">Password:</span> admin123</p>
      </div>
    </div>

  </div>
</body>


    <script src="script/script.js"></script>
</body>
</html>
